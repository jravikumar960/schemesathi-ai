[alembic]
# Resolved relative to this ini file, so it works from any working directory on Windows.
script_location = %(here)s/migrations

# Make the `app` package importable when alembic runs from backend/.
prepend_sys_path = .

# No sqlalchemy.url here on purpose: migrations/env.py reads DATABASE_URL via app.config.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
